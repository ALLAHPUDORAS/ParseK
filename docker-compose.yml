services:
  lead-pipeline:
    build: .
    container_name: lead-pipeline
    volumes:
      - ./output:/app/src/output
      - ./logs:/app/src/logs
      - playwright-cache:/ms-playwright
    env_file:
      - .env
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - POLL_INTERVAL=3600
      - ONE_SHOT=0
    restart: unless-stopped
    command: ["--headless", "--export-json", "--export-csv", "--export-text"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  playwright-cache:
    driver: local
